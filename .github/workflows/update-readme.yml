name: Update profile README

on:
  schedule:
    - cron: "17 3 * * *" # every night at 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reads only public repositories (see scripts/generate.mjs).
      - name: Generate SVGs and README
        run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "Tommaso Piscaglia"
          git config user.email "186226818+tommipisca@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "Nothing to update"
          else
            git commit -m "Update profile README"
            git push
          fi
