<svg xmlns="http://www.w3.org/2000/svg" width="900" height="24" viewBox="0 0 900 24" role="img" aria-label="Snake divider">
  <style>
    .s { transform: translateX(-120px); animation: slither 9.600000000000001s linear 1.60s infinite; }
    @keyframes slither { 0% { transform: translateX(-120px); } 16.667% { transform: translateX(1020px); } 100% { transform: translateX(1020px); } }
    .p { transform-box: fill-box; transform-origin: center; animation: eat 9.600000000000001s linear infinite; }
    @keyframes eat { 0% { opacity: 0; transform: scale(.2); } 62% { opacity: 0; transform: scale(.2); } 72%, 100% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
